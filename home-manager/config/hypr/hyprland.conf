# #############
# ## KEYMAPS ##
# #############

# Function 

bind = ,F8,   exec, wpctl set-mute @DEFAULT_SINK@ toggle 
bind = ,xf86audioraisevolume, exec, wpctl set-volume @DEFAULT_SINK@ 10%+
bind = ,xf86audiolowervolume, exec, wpctl set-volume @DEFAULT_SINK@ 10%- 
bind = ,F2, exec, wpctl set-volume @DEFAULT_SOURCE@ toggle
bind = ,F9, exec, wpctl set-volume @DEFAULT_SOURCE@ 10%-
bind = ,F10, exec, wpctl set-volume @DEFAULT_SOURCE@ 10%+
bind = ,xf86audiolowervolume, exec, wpctl set-volume @DEFAULT_SINK@ 10%- 
bind = ,XF86AudioMute,   exec, wpctl set-mute @DEFAULT_SOURCE@ toggle 
bind = ,F7,   exec, blockwifi
bind = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- 
bind = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+  

# Applications 

bind = $super, Q, exec, $term
bind = $super, C, killactive,
bind = $super, S, exec, $devicesend
bind = $super, RETURN, exec, $launch
bind = $super, H, exec, $wallswitcher
bind = $super, F, fullscreen,
bind = $super, W, exec, changewall
# bind = $super, C, exec, makoctl dismiss -a

# Layout 

bind = $super, V, togglefloating, # dwindle
bind = $super, space, exec, $toggleaspect
# bind = $super, tab, hyprtasking:toggle, all
# bind = $super, space, hyprtasking:toggle, cursor

bind = ,PRINT, exec, $screenshot -m region --clipboard-only
bind = $super, PRINT, exec, $screenshot -m output
  
# Special Workspace

bind = $super SHIFT, 1, movetoworkspace, 1
bind = $super SHIFT, 2, movetoworkspace, 2
bind = $super SHIFT, 3, movetoworkspace, 3
bind = $super SHIFT, 4, movetoworkspace, 4
bind = $super SHIFT, 5, movetoworkspace, 5
bind = $super SHIFT, 6, movetoworkspace, 6
bind = $super SHIFT, 7, movetoworkspace, 7
bind = $super SHIFT, 8, movetoworkspace, 8
bind = $super SHIFT, 9, movetoworkspace, 9

# Swap Windows

bind = $super SHIFT, left, swapwindow, l
bind = $super SHIFT, right, swapwindow, r
bind = $super SHIFT, up, swapwindow, u
bind = $super SHIFT, down, swapwindow, d

# Move Focus

bind = $super, left, movefocus, l
bind = $super, right, movefocus, r
bind = $super, up, movefocus, u
bind = $super, down, movefocus, d


# Switch Workspaces

bind = $super, 1, workspace, 1
bind = $super, 2, workspace, 2
bind = $super, 3, workspace, 3
bind = $super, 4, workspace, 4
bind = $super, 5, workspace, 5
bind = $super, 6, workspace, 6
bind = $super, 7, workspace, 7
bind = $super, 8, workspace, 8
bind = $super, 9, workspace, 9
bind = $super, 0, workspace, 10


# Drag/Resize Windows

bind = SHIFT, LEFT, resizeactive, -50 0
bind = SHIFT, RIGHT, resizeactive, 50 0
bind = SHIFT, UP, resizeactive, 0 -50
bind = SHIFT, DOWN, resizeactive, 0 50
bindm = $super, mouse:272, movewindow

