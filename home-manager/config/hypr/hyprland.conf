# #############
# ## MONITOR ##
# #############

monitor = eDP-1,1920x1080@60,0x0,1.2
# monitor = eDP-2,640x320@60,1080x0,4.2

# ##############
# ## Xwayland ##
# ##############

xwayland {
  force_zero_scaling = true
  use_nearest_neighbor = true
  enabled = true
}

# ###############
# ## Ecosystem ##
# ###############

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

# ########################################
# ## Configure mouse and touchpad here. ##
# ########################################

input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0.0
    # repeat_rate = 50
    # repeat_delay = 600
    scroll_method = 2fg

    touchpad {
     natural_scroll = yes
     disable_while_typing = no
     middle_button_emulation = no
     drag_lock = no
     tap-to-click = true
     scroll_factor = 1.0
    }
}

cursor {
    sync_gsettings_theme = false
    enable_hyprcursor = false
    no_hardware_cursors = true
}

# ####################################################################
# ## Configure general , decoration , gestures and animations here. ##
# ####################################################################

general {
  gaps_in = 5 
  gaps_out = 5, 5, 5, 5
  float_gaps = 5
  border_size = 2
  col.active_border = $crystalBlue
  col.inactive_border = $lotusGray
  layout = dwindle 
  resize_on_border = true
  extend_border_grab_area = 25
  allow_tearing = false  # Vsync
  # no_border_on_floating = false
}


decoration {
  rounding = 2
  inactive_opacity = 0.6
  active_opacity = 0.95
  fullscreen_opacity = 1.0

   shadow {
    scale = 1.0
    # color = $on_surface_variant
    color_inactive = $sumiInk3
  }

  blur {
    enabled = true
    size = 5
    passes = 5
    ignore_opacity = false
    brightness = 0.3
    xray = false
    contrast = 1.0
    popups = true
    new_optimizations = true
    noise = 0
  }
}

gestures {
 # workspace_swipe = 1
 # workspace_swipe_fingers=3
  workspace_swipe_distance=400
  workspace_swipe_min_speed_to_force=30
  workspace_swipe_create_new = true
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_forever = true
}

animations {
  enabled = true
  #first_launch_animation = false

# Defining Custom Bezier Curves
  bezier = bounce, 0.7, 1.9, 0.5, 1
  bezier = slide, 0.25, 0.1, 0.25, 1

# Applying Bezier Curves 
  animation = windowsIn, 1, 2, slide
  animation = windowsOut, 1, 2, slide
  animation = windowsMove, 1, 2, slide
  animation = workspaces, 1, 2, slide
  animation = windows, 1, 2, bounce
}

# #####################################
# ## Configure layout settings here. ##
# #####################################

dwindle {
  # pseudotile = yes 
  preserve_split = yes
  force_split = 1
  default_split_ratio = 1
}

master {
  new_status = master
}

# ###################################
# ## Configure misc settings here. ##
# ###################################

misc {
    disable_hyprland_logo = true
    # enable_swallow = true
    # swallow_regex = ^(foot)$
    focus_on_activate = true
    mouse_move_enables_dpms = true
    # vfr = true
    vrr = 0 
    animate_manual_resizes = false
    mouse_move_focuses_monitor = true
    disable_splash_rendering = true
}

render { 
  direct_scanout = true
  new_render_scheduling	= true
}

# ####################################
# ## Configure Debug settings here. ##
# ####################################

debug {
  damage_tracking = 2
  disable_logs = true
  disable_time = true
  #watchdog_timeout = 0
}


# ################
# ## ECO-SYSTEM ##
# ################

ecosystem {
  no_update_news = true
}

