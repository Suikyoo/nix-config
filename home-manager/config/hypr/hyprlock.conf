source = colors/colors.conf

general{
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/suikyo/Pictures/Wallpapers/character
    blur_passes = 4
    blur_size = 4
    vibrancy = 1
    vibrancy_darkness = 0
}




label {
  monitor =
    color = $tertiary #$tertiary_container #rgba(137, 180, 250, 1.0)
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    font_size = 18
    font_family = Azonix
    position = 0, 320
    halign = center
    valign = center
}

label {
  monitor =
    text = cmd[update:1000] echo "<span>$(date '+%H:%M')</span>"
    color = $tertiary #$tertiary_container #rgba(137, 180, 250, 1.0)
    font_size = 280
    font_famil = Azonix
    position = 0, 56 # h,v
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER  
    font_size = 14
    color =  $tertiary_container #rgba(137, 180, 250, 1.0)
    font_family = Azonix
    halign = center
    valign = center
    position = 0, -200
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.3     # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2  # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $tertiary_container #rgba(40,40,40, 0.1)
    inner_color = rgba(137, 180, 250, 0.1)
    fade_on_empty = true
    placeholder_text = Enter Password   # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, -260
    halign = center
    valign = center
}
